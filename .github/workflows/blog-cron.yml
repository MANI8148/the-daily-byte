# The cheapest reliable "cloud machine": GitHub Actions runs the worker on a cron.
# Free for public repos; private repos get 2,000 min/month (a 5-min daily run is ~150).
# Put secrets in Settings -> Secrets and variables -> Actions.
name: bloggy-daily

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours — 5 topic posts per run (free-tier safe: ~12 runs/day)
  workflow_dispatch:
    inputs:
      count:
        description: "Posts per lane this run (overrides LANES_PER_RUN; default 1 = 5 posts/hr across 5 lanes)"
        required: false
        default: "1"

concurrency:
  group: bloggy-run
  cancel-in-progress: true   # never overlap two runs

jobs:
  write-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Patch the default GITHUB_TOKEN to allow committing cron results (drafts -> content/)
    permissions:
      contents: write
    env:
      # Free LLM endpoints work here. Examples:
      #   Groq:        OPENAI_BASE_URL=https://api.groq.com/openai/v1,  model=llama-3.3-70b-versatile
      #   Gemini:      OPENAI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/, model=gemini-2.0-flash (key = AI Studio key)
      #   OpenRouter:  OPENAI_BASE_URL=https://openrouter.ai/api/v1,    model=meta-llama/llama-3.3-70b-instruct:free
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      LLM_SCORE_MODEL: ${{ secrets.LLM_SCORE_MODEL }}   # cheap model for curation
      LLM_SCORE_THRESHOLD: "6"
      LLM_FALLBACKS: ${{ secrets.LLM_FALLBACKS }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
      HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
      HASHNODE_PUBLICATION: ${{ secrets.HASHNODE_PUBLICATION }}
      GHOST_ADMIN_KEY: ${{ secrets.GHOST_ADMIN_KEY }}
      GHOST_URL: ${{ secrets.GHOST_URL }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      AUTO_PUBLISH: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # full clone so we can commit + push results back
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OSS scraper deps + pytest
        run: pip install -r worker/requirements.txt
      - name: Install opencode CLI (4th LLM fallback tier)
        run: npm i -g opencode-ai || curl -fsSL https://opencode.ai/install | bash
      # FIX: run as a module (-m worker.app) so the relative imports in worker/ resolve
      - name: Run one pipeline pass (draft + checks; publishes only if AUTO_PUBLISH=true)
        run: python -m worker.app run-once --source all --count "${{ github.event.inputs.count || '2' }}"
      # Commit whatever drafts/images the cron produced (no-op if nothing changed)
      - name: Commit cron results
        run: |
          git config user.name "the-daily-byte[bot]"
          git config user.email "bot@the-daily-byte.local"
          git add -A content site/public/images
          git diff --cached --quiet || git commit -m "cron: $(date -u +%Y-%m-%dT%H:%M:%SZ) dispatch"
          # Use the fine-grained PAT for push when present; else fall back to GITHUB_TOKEN (write perms above)
          if [ -n "$GH_PAT" ]; then
            git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/MANI8148/the-daily-byte.git"
          fi
          git push
        env:
          GH_PAT: ${{ secrets.GH_PAT }}